name: Teacher Edition static smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check teacher.js
      - run: node scripts/teacher-smoke.mjs
      - run: bash scripts/browser-smoke.sh
